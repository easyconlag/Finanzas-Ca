<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Libro de Cuentas | Catalina Palacios S.A.S.</title>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      body {
        background: #fff0f5;
        color: #333;
        padding: 20px;
      }
      .btn-regresar {
        padding: 10px 20px;
        border-radius: 12px;
        background: #880e4f;
        color: white;
        border: none;
        cursor: pointer;
        font-weight: bold;
        margin-bottom: 20px;
        transition: background 0.2s;
      }
      .btn-regresar:hover {
        background: #ad1457;
      }
      .filtro-btn.active-filtro {
        background: #e91e63 !important;
        color: white !important;
      }
    </style>
  </head>
  <body>
    <!-- Botón para regresar al panel principal -->
    <button class="btn-regresar" onclick="window.location.href = 'index.html'">
      ⬅ Volver al Panel Principal
    </button>

    <!-- DENTRO DEL CONTENEDOR PRINCIPAL, AL NIVEL DE TUS OTRAS VISTAS -->
    <section
      id="view-deudas"
      class="view-section"
      style="
        display: none;
        width: 100%;
        max-width: 1200px;
        margin: 30px auto;
        padding: 20px;
        box-sizing: border-box;
        background: #fff;
        border-radius: 25px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      "
    >
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          flex-wrap: wrap;
          gap: 15px;
          margin-bottom: 25px;
          border-bottom: 2px solid #fce4ec;
          padding-bottom: 20px;
        "
      >
        <div>
          <h2
            style="
              color: #880e4f;
              font-size: 2rem;
              font-weight: 900;
              margin: 0 0 5px 0;
            "
          >
            📖 Libro de Cuentas
          </h2>
          <p style="color: #666; margin: 0; font-size: 0.95rem">
            Control total de tus deudas y dinero por cobrar.
          </p>
        </div>
        <button
          type="button"
          onclick="abrirModalNuevaDeuda()"
          style="
            padding: 12px 22px;
            border-radius: 15px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            background: #e91e63;
            border: none;
            color: white;
            box-shadow: 0 4px 15px rgba(233, 30, 99, 0.3);
          "
        >
          ➕ Registrar Cuenta / Préstamo
        </button>
      </div>
      <!-- PESTAÑAS DE ESTADO (PENDIENTES / HISTORIAL) -->
      <div
        style="
          display: flex;
          gap: 10px;
          margin-bottom: 20px;
          border-bottom: 2px solid #fce4ec;
          padding-bottom: 15px;
        "
      >
        <button
          type="button"
          onclick="cambiarVistaDeudas('pendientes', this)"
          id="tab-btn-pendientes"
          style="
            padding: 10px 20px;
            border-radius: 15px;
            border: none;
            font-weight: 800;
            cursor: pointer;
            background: #e91e63;
            color: white;
            box-shadow: 0 4px 15px rgba(233, 30, 99, 0.3);
          "
        >
          📋 Cuentas Pendientes
        </button>
        <button
          type="button"
          onclick="cambiarVistaDeudas('historial', this)"
          id="tab-btn-historial"
          style="
            padding: 10px 20px;
            border-radius: 15px;
            border: none;
            font-weight: 800;
            cursor: pointer;
            background: #fff;
            color: #555;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
          "
        >
          📚 Historial Saldadas
        </button>
      </div>
      <!-- FILTRADO Y BÚSQUEDA -->
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          flex-wrap: wrap;
          gap: 15px;
          margin-bottom: 20px;
          background: #fff0f5;
          padding: 15px 20px;
          border-radius: 20px;
        "
      >
        <div style="display: flex; gap: 10px; flex-wrap: wrap">
          <button
            type="button"
            onclick="filtrarDeudas('todos', this)"
            class="filtro-btn active-filtro"
            style="
              padding: 8px 16px;
              border-radius: 12px;
              border: none;
              font-weight: 700;
              cursor: pointer;
              background: #e91e63;
              color: white;
            "
          >
            Todos
          </button>
          <button
            type="button"
            onclick="filtrarDeudas('cobrar', this)"
            class="filtro-btn"
            style="
              padding: 8px 16px;
              border-radius: 12px;
              border: none;
              font-weight: 700;
              cursor: pointer;
              background: #fff;
              color: #555;
            "
          >
            📥 Me deben
          </button>
          <button
            type="button"
            onclick="filtrarDeudas('pagar', this)"
            class="filtro-btn"
            style="
              padding: 8px 16px;
              border-radius: 12px;
              border: none;
              font-weight: 700;
              cursor: pointer;
              background: #fff;
              color: #555;
            "
          >
            📤 Debo
          </button>
        </div>
        <div>
          <input
            type="text"
            id="input-buscar-deuda"
            onkeyup="renderizarDeudas()"
            placeholder="🔍 Buscar por persona o concepto..."
            style="
              padding: 10px 15px;
              border-radius: 12px;
              border: 1px solid #f06292;
              outline: none;
              width: 250px;
              font-size: 0.9rem;
            "
          />
        </div>
      </div>
      <div
        style="
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
          gap: 20px;
          margin-bottom: 25px;
        "
      >
        <div
          style="
            background: #e8f5e9;
            padding: 20px;
            border-radius: 20px;
            border-left: 6px solid #2e7d32;
          "
        >
          <span
            style="
              font-size: 0.8rem;
              color: #2e7d32;
              font-weight: 800;
              text-transform: uppercase;
              display: block;
              margin-bottom: 5px;
            "
            >Total por Cobrar</span
          >
          <strong
            style="color: #2e7d32; font-size: 1.8rem"
            id="lbl-total-cobrar"
            >$0</strong
          >
        </div>
        <div
          style="
            background: #ffebee;
            padding: 20px;
            border-radius: 20px;
            border-left: 6px solid #c62828;
          "
        >
          <span
            style="
              font-size: 0.8rem;
              color: #c62828;
              font-weight: 800;
              text-transform: uppercase;
              display: block;
              margin-bottom: 5px;
            "
            >Total por Pagar</span
          >
          <strong style="color: #c62828; font-size: 1.8rem" id="lbl-total-pagar"
            >$0</strong
          >
        </div>
      </div>

      <div
        style="
          background: #fff;
          border-radius: 20px;
          border: 1px solid #f0f0f0;
          overflow: hidden;
        "
      >
        <div
          style="
            padding: 15px 20px;
            background: #fff0f5;
            font-weight: 800;
            color: #880e4f;
            font-size: 1.1rem;
          "
        >
          📋 Listado de Registros
        </div>
        <div style="overflow-x: auto">
          <table
            style="
              width: 100%;
              border-collapse: collapse;
              text-align: left;
              min-width: 600px;
            "
          >
            <thead>
              <tr
                style="
                  background: #fafafa;
                  color: #880e4f;
                  font-size: 0.85rem;
                  border-bottom: 1px solid #eee;
                "
              >
                <th style="padding: 12px 15px">Tipo</th>
                <th style="padding: 12px 15px">Persona / Entidad</th>
                <th style="padding: 12px 15px">Concepto</th>
                <th style="padding: 12px 15px">Monto</th>
                <th style="padding: 12px 15px">Fecha de Corte</th>
                <th style="padding: 12px 15px; text-align: center">Acciones</th>
              </tr>
            </thead>
            <tbody id="tabla-deudas-body">
              <!-- Datos dinámicos -->
            </tbody>
          </table>
        </div>
      </div>
      <!-- GRÁFICA DE RESUMEN VISUAL (BARRAS CSS) -->
      <div
        style="
          background: white;
          border-radius: 20px;
          padding: 20px;
          margin-bottom: 25px;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        "
      >
        <h4
          style="
            color: #880e4f;
            margin-top: 0;
            font-size: 1.1rem;
            font-weight: 800;
            margin-bottom: 15px;
          "
        >
          📊 Comparativa de Saldos (Cobrar vs Pagar)
        </h4>
        <div style="display: flex; flex-direction: column; gap: 12px">
          <div>
            <div
              style="
                display: flex;
                justify-content: space-between;
                font-size: 0.85rem;
                font-weight: 700;
                color: #2e7d32;
                margin-bottom: 4px;
              "
            >
              <span>Por Cobrar</span>
              <span id="grafica-lbl-cobrar">$0</span>
            </div>
            <div
              style="
                width: 100%;
                background: #f0f0f0;
                border-radius: 10px;
                height: 14px;
                overflow: hidden;
              "
            >
              <div
                id="barra-cobrar"
                style="
                  width: 0%;
                  background: #2e7d32;
                  height: 100%;
                  border-radius: 10px;
                  transition: width 0.5s ease;
                "
              ></div>
            </div>
          </div>
          <div>
            <div
              style="
                display: flex;
                justify-content: space-between;
                font-size: 0.85rem;
                font-weight: 700;
                color: #c62828;
                margin-bottom: 4px;
              "
            >
              <span>Por Pagar</span>
              <span id="grafica-lbl-pagar">$0</span>
            </div>
            <div
              style="
                width: 100%;
                background: #f0f0f0;
                border-radius: 10px;
                height: 14px;
                overflow: hidden;
              "
            >
              <div
                id="barra-pagar"
                style="
                  width: 0%;
                  background: #c62828;
                  height: 100%;
                  border-radius: 10px;
                  transition: width 0.5s ease;
                "
              ></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Carga tu JavaScript principal -->
    <script src="../js/main.js"></script>
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const token = localStorage.getItem("token");
        if (token && typeof renderizarDeudas === "function") {
          renderizarDeudas();
        }
      });
    </script>
  </body>
</html>
